<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YT Analytics</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23ff3b4f'/><path d='M12 9l12 7-12 7z' fill='white'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb;--bg2:#eef0f6;--card:#ffffff;--line:#e4e7ef;--text:#14161c;--mute:#6b7280;--soft:#9aa1ad;
  --acc:#ff3b4f;--acc2:#ff7a45;--accbg:rgba(255,59,79,.08);--up:#16a34a;--down:#dc2626;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.06);--r:16px
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0b0d12;--bg2:#12151c;--card:#151922;--line:#232837;--text:#e9ecf2;--mute:#8e95a3;--soft:#5f6676;
  --accbg:rgba(255,59,79,.12);--up:#3ccf72;--down:#ff6363;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme=dark]{--bg:#0b0d12;--bg2:#12151c;--card:#151922;--line:#232837;--text:#e9ecf2;--mute:#8e95a3;--soft:#5f6676;
  --accbg:rgba(255,59,79,.12);--up:#3ccf72;--down:#ff6363;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;box-shadow:0 4px 14px rgba(255,59,79,.35)}
.logo i:after{content:"";border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.logo span{color:var(--mute);font-weight:500}
form.add{flex:1;display:flex;max-width:620px;margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow);transition:border-color .15s}
form.add:focus-within{border-color:var(--acc)}
form.add input{flex:1;border:0;background:none;outline:none;padding:8px 12px;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--soft)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.6;cursor:wait}
.icon{width:38px;height:38px;padding:0;justify-content:center}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
main{padding:28px 0 60px}
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--accbg);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);padding:14px 16px;border-radius:12px;margin-bottom:20px}
.banner b{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px}
.kpi,.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.kpi{padding:16px 18px}
.kpi .l{color:var(--mute);font-size:12.5px;font-weight:500}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:12.5px;margin-top:2px}
.sec{display:flex;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.sec h2{font-size:18px;margin:0;letter-spacing:-.01em}
.sec .cnt{background:var(--bg2);color:var(--mute);font-size:12px;padding:2px 8px;border-radius:99px;font-weight:600}
.sp{flex:1}
.seg{display:inline-flex;background:var(--bg2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--mute);font-weight:500;font-size:13px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.search{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;outline:none;width:220px;max-width:100%}
.search:focus{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{padding:18px;cursor:pointer;position:relative;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);border-color:var(--soft)}
.card.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg),var(--shadow)}
.top{display:flex;gap:12px;align-items:center;padding-right:28px}
.ava{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--bg2);flex:none}
.t{font-weight:600;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.h{color:var(--mute);font-size:12.5px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.nums .l{color:var(--mute);font-size:11.5px;font-weight:500}
.nums .v{font-size:18px;font-weight:700;letter-spacing:-.01em}
.d{font-size:11.5px;font-weight:600}.up{color:var(--up)}.down{color:var(--down)}.mute{color:var(--soft);font-weight:500}
.x{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:8px;border:0;background:none;color:var(--soft);cursor:pointer;font-size:18px;opacity:0;transition:.15s}
.card:hover .x{opacity:1}.x:hover{background:var(--accbg);color:var(--down)}
.spark{width:100%;height:46px;margin-top:14px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--bg2);color:var(--mute);font-size:11.5px;padding:3px 8px;border-radius:99px;font-weight:500}
.empty{text-align:center;padding:64px 20px;border:2px dashed var(--line);border-radius:var(--r);color:var(--mute)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.empty code{background:var(--bg2);padding:2px 6px;border-radius:6px;font-size:12.5px}
#detail{margin-top:36px;scroll-margin-top:90px}
.hero{display:flex;gap:18px;align-items:center;padding:22px;flex-wrap:wrap}
.hero .ava{width:72px;height:72px}
.hero h2{margin:0;font-size:22px;letter-spacing:-.02em}
.hero p{margin:4px 0 0;color:var(--mute);font-size:13px;max-width:640px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line)}
.stats>div{padding:16px 22px;border-right:1px solid var(--line)}
.stats>div:last-child{border-right:0}
.stats .l{color:var(--mute);font-size:12px;font-weight:500}.stats .v{font-size:20px;font-weight:700;letter-spacing:-.01em}
.panel{margin-top:14px;padding:18px 20px}
.chart{position:relative;height:200px;margin-top:10px}
.chart svg{width:100%;height:100%;display:block;overflow:visible}
.chart rect.b{fill:var(--acc);opacity:.85;cursor:pointer;transition:opacity .1s}
.chart rect.b.s{fill:var(--acc2);opacity:.6}
.chart rect.b:hover{opacity:1}
.chart line{stroke:var(--line)}.chart text{fill:var(--soft);font-size:11px}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12px;max-width:280px;z-index:50;opacity:0;transition:opacity .1s}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tw{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--mute);font-weight:600;font-size:12px;cursor:pointer;user-select:none;text-transform:uppercase;letter-spacing:.03em}
th:hover,th.s{color:var(--text)}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg2)}
td.title,th.title{text-align:left;white-space:normal;min-width:340px}
td.title a{text-decoration:none;display:flex;gap:12px;align-items:center;font-weight:500}
td.title a:hover span{color:var(--acc)}
.thumb{position:relative;flex:none}
.thumb img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block;background:var(--bg2)}
.thumb em{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.78);color:#fff;font-size:10.5px;font-style:normal;padding:1px 5px;border-radius:4px;font-weight:600}
.tag{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--accbg);color:var(--acc);margin-left:6px;vertical-align:1px}
.bar-in{display:inline-block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));vertical-align:middle;margin-right:8px;opacity:.75}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:500;opacity:0;transition:.25s;z-index:60;max-width:90vw;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--down);color:#fff}
.login{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:var(--bg);padding:16px}
.login.show{display:grid}
.login form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 28px;box-shadow:var(--shadow);text-align:center}
.login .logo{justify-content:center;margin-bottom:6px}
.login p{color:var(--mute);margin:0 0 22px;font-size:13px}
.login input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;margin-bottom:12px}
.login input:focus{border-color:var(--acc)}
.login .btn{width:100%;justify-content:center;padding:12px}
.login .e{color:var(--down);font-size:13px;min-height:20px;margin-top:10px}
.skel{background:linear-gradient(90deg,var(--bg2),var(--line),var(--bg2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r);height:180px}
@keyframes sk{to{background-position:-200% 0}}
footer{color:var(--soft);font-size:12px;text-align:center;padding:10px 0 30px}
@media (max-width:760px){.wrap{padding:0 16px}.bar{height:auto;flex-wrap:wrap;padding:12px 0}form.add{order:3;max-width:none;flex-basis:100%}.logo span{display:none}.stats>div{border-right:0;border-bottom:1px solid var(--line)}}
</style></head><body>
<header><div class="wrap bar">
  <div class="logo"><i></i>YT Analytics <span>· дашборд каналов</span></div>
  <form class="add" id="add"><input id="q" placeholder="Ссылка на канал, @handle или ссылка на видео" autocomplete="off" required><button class="btn primary" id="addbtn">＋ Добавить</button></form>
  <button class="btn icon" id="force" title="Обновить данные из API"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></button>
  <button class="btn icon" id="logout" title="Выйти" style="display:none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
  <button class="btn icon" id="theme" title="Тема"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</div></header>
<main class="wrap">
  <div id="banner"></div>
  <div id="kpis" class="kpis"></div>
  <div class="sec"><h2>Каналы</h2><span class="cnt" id="cnt">0</span><span class="sp"></span>
    <input class="search" id="fch" placeholder="Поиск по каналам">
    <div class="seg" id="csort"><button data-k="subs" class="on">Подписчики</button><button data-k="views">Просмотры</button><button data-k="growth">Рост 24ч</button><button data-k="added_at">Новые</button></div>
  </div>
  <div id="grid" class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <section id="detail"></section>
</main>
<footer id="foot"></footer>
<div class="login" id="login"><form id="lf"><div class="logo"><i></i>YT Analytics</div><p>Введите пароль, чтобы открыть дашборд</p>
  <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" required><button class="btn primary" id="lb">Войти</button><div class="e" id="le"></div></form></div>
<div class="tip" id="tip"></div><div class="toast" id="toast"></div>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const full=n=>n==null?'—':Number(n).toLocaleString('ru-RU');
const cmp=n=>n==null?'скрыто':new Intl.NumberFormat('ru-RU',{notation:'compact',maximumFractionDigits:1}).format(n);
const per=h=>h<24?Math.round(h)+'ч':Math.round(h/24)+'д';
const dur=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const ago=t=>{const d=(Date.now()/1000-t)/86400;return d<1?Math.max(1,Math.round(d*24))+' ч назад':d<30?Math.round(d)+' дн назад':d<365?Math.round(d/30)+' мес назад':(d/365).toFixed(1)+' г назад'};
let S={channels:[],active:null,videos:[],summary:null,sort:{k:'published',d:-1},csort:'subs',cf:'',vf:'all',vq:''};

try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#theme').onclick=()=>{const dark=matchMedia('(prefers-color-scheme: dark)').matches;const cur=document.documentElement.dataset.theme||(dark?'dark':'light');
  const n=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}};

let tt;function toast(m,err){const t=$('#toast');t.textContent=m;t.className='toast show'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.className='toast'+(err?' err':''),err?6000:2800)}
const norm=u=>{u=String(u||'').trim().replace(/\/+$/,'');return u&&!/^https?:\/\//.test(u)?'https://'+u:u};
// Адрес API: на сервере его отдаёт /config.js, на GitHub Pages config.js создаёт workflow из переменной репозитория YT_API_URL.
const BASE=norm(window.YT_API);
let TOKEN='';try{TOKEN=localStorage.getItem('yt_token')||''}catch(e){}
function setToken(t){TOKEN=t;try{t?localStorage.setItem('yt_token',t):localStorage.removeItem('yt_token')}catch(e){};$('#logout').style.display=t?'':'none'}
const waiters=[];
function needLogin(){$('#login').classList.add('show');setTimeout(()=>$('#pw').focus(),50);return new Promise(r=>waiters.push(r))}
async function api(path,opt={}){
  const h=Object.assign({},opt.headers||{});if(TOKEN)h.Authorization='Bearer '+TOKEN;
  let r;try{r=await fetch(BASE+path,Object.assign({},opt,{headers:h,credentials:'omit'}))}catch(e){throw new Error('Сервер недоступен ('+(BASE||location.host)+')')}
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&j.auth){setToken('');await needLogin();return api(path,opt)}
  if(!r.ok)throw new Error(j.error||r.statusText);return j}
$('#lf').addEventListener('submit',async e=>{e.preventDefault();const b=$('#lb');b.disabled=true;$('#le').textContent='';
  try{const r=await fetch(BASE+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Ошибка входа');
    setToken(j.token);$('#pw').value='';$('#login').classList.remove('show');waiters.splice(0).forEach(f=>f())}
  catch(err){$('#le').textContent=err.message.includes('fetch')?'Сервер недоступен':err.message}finally{b.disabled=false}});
$('#logout').onclick=()=>{setToken('');location.reload()};
if(TOKEN)$('#logout').style.display='';

function dl(d,k){
  if(!d||d[k]==null)return'<span class="d mute">—</span>';
  const v=d[k],c=v>0?'up':v<0?'down':'mute';
  return `<span class="d ${c}">${v>0?'+':''}${cmp(v)}</span><span class="d mute"> · ${per(d.hours)}</span>`;
}
function spark(h){
  const pts=h.filter(p=>p[1]!=null).map(p=>[p[0],p[1]]);
  const src=pts.length>=2?pts:h.map(p=>[p[0],p[2]]);
  if(src.length<2)return'<div class="chips"><span class="chip">📈 история копится — график появится через пару часов</span></div>';
  const w=300,H=46,xs=src.map(p=>p[0]),ys=src.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const X=x=>(x-x0)/(x1-x0||1)*w,Y=y=>H-4-(y-y0)/(y1-y0||1)*(H-8);
  const d=src.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
  const id='g'+Math.random().toString(36).slice(2,8);
  return `<svg class="spark" viewBox="0 0 ${w} ${H}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".25"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>
  <path d="${d}L${w} ${H}L0 ${H}Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

function render(){
  const all=S.channels;$('#cnt').textContent=all.length;
  if(!all.length){$('#kpis').innerHTML='';$('#grid').innerHTML=`<div class="empty" style="grid-column:1/-1"><b>Пока нет каналов</b>Вставь сверху ссылку на любой канал, который хочешь анализировать:<br><br>
    <code>https://youtube.com/@MrBeast</code> · <code>@handle</code> · <code>UC…</code> · <code>ссылку на видео</code></div>`;return}
  const sum=k=>all.reduce((a,c)=>a+(c[k]||0),0),sumd=(p,k)=>all.reduce((a,c)=>a+((c[p]&&c[p][k])||0),0);
  const dv=sumd('d1','views'),ds=sumd('d7','subs');
  $('#kpis').innerHTML=[
    ['Каналов',all.length,''],['Подписчики',cmp(sum('subs')),`<span class="${ds>0?'up':'mute'}">${ds>0?'+':''}${cmp(ds)} за 7 дн</span>`],
    ['Просмотры',cmp(sum('views')),`<span class="${dv>0?'up':'mute'}">${dv>0?'+':''}${cmp(dv)} за 24 ч</span>`],['Видео',full(sum('videos')),'']
  ].map(([l,v,s])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||'&nbsp;'}</div></div>`).join('');
  const f=S.cf.toLowerCase();
  let ch=all.filter(c=>!f||(c.title||'').toLowerCase().includes(f)||(c.handle||'').toLowerCase().includes(f));
  const key=c=>S.csort==='growth'?((c.d1&&c.d1.views)||0):(c[S.csort]||0);
  ch.sort((a,b)=>key(b)-key(a));
  $('#grid').innerHTML=ch.map(c=>{const sm=c.summary;return`
   <div class="card ${S.active===c.id?'on':''}" data-id="${c.id}">
     <button class="x" data-del="${c.id}" title="Удалить канал">×</button>
     <div class="top"><img class="ava" src="${esc(c.thumb)}" alt="" referrerpolicy="no-referrer"><div style="min-width:0"><div class="t">${esc(c.title)}</div><div class="h">${esc(c.handle||c.id)}${c.country?' · '+esc(c.country):''}</div></div></div>
     <div class="nums">
       <div><div class="l">Подписчики</div><div class="v">${cmp(c.subs)}</div>${dl(c.d1,'subs')}</div>
       <div><div class="l">Просмотры</div><div class="v">${cmp(c.views)}</div>${dl(c.d1,'views')}</div>
       <div><div class="l">Видео</div><div class="v">${full(c.videos)}</div>${dl(c.d7,'videos')}</div>
     </div>${spark(c.history)}
     ${sm?`<div class="chips"><span class="chip">⌀ ${cmp(sm.avg)} просм.</span>${sm.per_week!=null?`<span class="chip">${sm.per_week}/нед</span>`:''}<span class="chip">ER ${sm.er}%</span></div>`:''}
   </div>`}).join('')||'<div class="empty" style="grid-column:1/-1">Ничего не найдено</div>';
}

async function load(force){
  try{
    const j=await api('/api/channels'+(force?'?force=1':''));
    S.channels=j.channels;render();
    $('#banner').innerHTML=!j.key?`<div class="banner">🔑<div><b>Не задан ключ YouTube Data API</b><span class="h">Ключ не задан на сервере — данные не загружаются</span></div></div>`
      :j.error?`<div class="banner">⚠️<div><b>Не удалось обновить данные</b><span class="h">${esc(j.error)}</span></div></div>`:'';
    $('#foot').textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU')+' · данные кэшируются на 15 минут, снапшоты истории — раз в час';
    if(S.active&&!S.channels.find(c=>c.id===S.active)){S.active=null;$('#detail').innerHTML=''}
  }catch(e){toast(e.message,1)}
}

function chart(vs){
  const v=[...vs].reverse();if(v.length<2)return'';
  const W=1000,H=200,pad=34,max=Math.max(...v.map(x=>x.views))||1,bw=(W-pad)/v.length;
  const nice=n=>{const p=Math.pow(10,Math.floor(Math.log10(n)));return Math.ceil(n/p)*p};const top=nice(max);
  const grid=[0,.25,.5,.75,1].map(t=>{const y=H-20-t*(H-30);return`<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pad-6}" y="${y+4}" text-anchor="end">${cmp(top*t)}</text>`}).join('');
  const bars=v.map((x,i)=>{const h=x.views/top*(H-30);return`<rect class="b ${x.short?'s':''}" data-i="${vs.length-1-i}" x="${pad+i*bw+bw*.15}" y="${H-20-h}" width="${bw*.7}" height="${Math.max(h,1)}" rx="${Math.min(3,bw*.2)}"/>`}).join('');
  return`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${bars}</svg>`;
}

const COLS=[['title','Видео'],['published','Дата'],['duration','Длит.'],['views','Просмотры'],['vpd','В день'],['likes','Лайки'],['comments','Комм.'],['er','ER %']];
function renderDetail(){
  const c=S.channels.find(x=>x.id===S.active);if(!c){$('#detail').innerHTML='';return}
  const sm=S.summary||{};
  let v=S.videos.filter(x=>S.vf==='all'||(S.vf==='short'?x.short:!x.short));
  if(S.vq){const q=S.vq.toLowerCase();v=v.filter(x=>x.title.toLowerCase().includes(q))}
  const {k,d}=S.sort;v.sort((a,b)=>(typeof a[k]==='string'?a[k].localeCompare(b[k]):a[k]-b[k])*d);
  const maxv=Math.max(1,...S.videos.map(x=>x.views));
  $('#detail').innerHTML=`
  <div class="panel" style="padding:0">
    <div class="hero"><img class="ava" src="${esc(c.thumb)}" alt="" referrerpolicy="no-referrer">
      <div style="flex:1;min-width:220px"><h2>${esc(c.title)}</h2><p>${esc(c.descr||'')}</p>
        <div class="chips"><span class="chip">${esc(c.handle||c.id)}</span>${c.published?`<span class="chip">с ${new Date(c.published*1000).getFullYear()} г.</span>`:''}${sm.last?`<span class="chip">последнее видео ${ago(sm.last)}</span>`:''}</div></div>
      <a class="btn" href="https://youtube.com/channel/${c.id}" target="_blank" rel="noopener">Открыть на YouTube ↗</a></div>
    <div class="stats">
      <div><div class="l">Подписчики</div><div class="v">${full(c.subs)}</div></div>
      <div><div class="l">Ср. просмотры</div><div class="v">${cmp(sm.avg)}</div></div>
      <div><div class="l">Медиана</div><div class="v">${cmp(sm.median)}</div></div>
      <div><div class="l">Частота</div><div class="v">${sm.per_week!=null?sm.per_week+' <small class="h">/нед</small>':'—'}</div></div>
      <div><div class="l">Ср. ER</div><div class="v">${sm.er!=null?sm.er+'%':'—'}</div></div>
      <div><div class="l">Доля Shorts</div><div class="v">${sm.shorts!=null?sm.shorts+'%':'—'}</div></div>
    </div>
  </div>
  <div class="panel"><div class="sec" style="margin:0"><h2 style="font-size:15px">Просмотры последних ${S.videos.length} видео</h2><span class="sp"></span>
    <div class="legend"><span><i style="background:var(--acc)"></i>Видео</span><span><i style="background:var(--acc2);opacity:.6"></i>Shorts (≤3 мин)</span></div></div>
    <div class="chart" id="chart">${chart(S.videos)}</div></div>
  <div class="panel"><div class="sec" style="margin:0"><h2 style="font-size:15px">Видео</h2><span class="cnt">${v.length}</span><span class="sp"></span>
    <input class="search" id="vq" placeholder="Поиск по названию" value="${esc(S.vq)}">
    <div class="seg" id="vf">${[['all','Все'],['long','Видео'],['short','Shorts']].map(([k2,n])=>`<button data-f="${k2}" class="${S.vf===k2?'on':''}">${n}</button>`).join('')}</div></div>
  <div class="tw"><table><thead><tr>${COLS.map(([key,n])=>`<th data-k="${key}" class="${key==='title'?'title ':''}${key===k?'s':''}">${n}${key===k?(d>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead><tbody>
  ${v.map(x=>`<tr>
    <td class="title"><a href="https://youtu.be/${x.id}" target="_blank" rel="noopener"><span class="thumb"><img src="${esc(x.thumb)}" loading="lazy" alt="" referrerpolicy="no-referrer"><em>${dur(x.duration)}</em></span><span>${esc(x.title)}${x.short?'<span class="tag">SHORTS</span>':''}${x.live?'<span class="tag">LIVE</span>':''}</span></a></td>
    <td title="${new Date(x.published*1000).toLocaleString('ru-RU')}">${new Date(x.published*1000).toLocaleDateString('ru-RU')}</td><td>${dur(x.duration)}</td>
    <td><span class="bar-in" style="width:${Math.round(x.views/maxv*60)}px"></span><b class="${sm.avg&&x.views>sm.avg*1.5?'up':''}">${full(x.views)}</b></td><td>${full(x.vpd)}</td><td>${full(x.likes)}</td><td>${full(x.comments)}</td><td>${x.er.toFixed(2)}</td>
  </tr>`).join('')||'<tr><td colspan="8" style="text-align:center;color:var(--mute)">Нет видео</td></tr>'}</tbody></table></div></div>`;
  const vq=$('#vq');vq.oninput=()=>{S.vq=vq.value;const p=vq.selectionStart;renderDetail();const n=$('#vq');n.focus();n.setSelectionRange(p,p)};
}
async function openChannel(id,force){
  const first=S.active!==id;S.active=id;render();
  if(first){S.vq='';S.vf='all';$('#detail').innerHTML='<div class="skel" style="height:320px"></div>';$('#detail').scrollIntoView({behavior:'smooth'})}
  try{const j=await api('/api/videos/'+id+(force?'?force=1':''));S.videos=j.videos;S.summary=j.summary;
    const c=S.channels.find(x=>x.id===id);if(c)c.summary=j.summary;render();renderDetail()}
  catch(e){$('#detail').innerHTML=`<div class="banner">⚠️<div><b>Не удалось загрузить видео</b><span class="h">${esc(e.message)}</span></div></div>`}
}

$('#grid').addEventListener('click',async e=>{
  const del=e.target.closest('[data-del]');
  if(del){e.stopPropagation();const c=S.channels.find(x=>x.id===del.dataset.del);if(!confirm(`Удалить «${c?c.title:''}» и его историю?`))return;
    await api('/api/channels/'+del.dataset.del,{method:'DELETE'});toast('Канал удалён');return load()}
  const card=e.target.closest('.card');if(card)openChannel(card.dataset.id);
});
$('#csort').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.csort=b.dataset.k;
  [...$('#csort').children].forEach(x=>x.classList.toggle('on',x===b));render()});
$('#fch').addEventListener('input',e=>{S.cf=e.target.value;render()});
$('#detail').addEventListener('click',e=>{
  const th=e.target.closest('th');if(th){const k=th.dataset.k;S.sort={k,d:S.sort.k===k?-S.sort.d:-1};return renderDetail()}
  const f=e.target.closest('[data-f]');if(f){S.vf=f.dataset.f;return renderDetail()}
  const b=e.target.closest('rect.b');if(b){window.open('https://youtu.be/'+S.videos[b.dataset.i].id,'_blank','noopener')}
});
const tip=$('#tip');
$('#detail').addEventListener('mousemove',e=>{const b=e.target.closest('rect.b');if(!b){tip.style.opacity=0;return}
  const x=S.videos[b.dataset.i];tip.innerHTML=`<b>${esc(x.title)}</b><br>${full(x.views)} просмотров · ${new Date(x.published*1000).toLocaleDateString('ru-RU')}`;
  tip.style.opacity=1;tip.style.left=Math.min(e.clientX+14,innerWidth-300)+'px';tip.style.top=(e.clientY+14)+'px'});
$('#add').addEventListener('submit',async e=>{e.preventDefault();const q=$('#q').value.trim(),btn=$('#addbtn');
  btn.disabled=true;btn.textContent='Ищу…';
  try{const j=await api('/api/channels',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});
    $('#q').value='';toast('Добавлен: '+(j.title||'канал'));await load();openChannel(j.id)}
  catch(err){toast(err.message,1)}finally{btn.disabled=false;btn.textContent='＋ Добавить'}});
$('#force').addEventListener('click',async()=>{const i=$('#force svg');i.classList.add('spin');await load(true);if(S.active)await openChannel(S.active,true);i.classList.remove('spin');toast('Данные обновлены')});
if(!BASE){$('#login').classList.add('show');$('#le').textContent='Сайт не настроен: не задан адрес сервера';$('#lb').disabled=true}else load();setInterval(load,15*60*1000);
</script></body></html>
