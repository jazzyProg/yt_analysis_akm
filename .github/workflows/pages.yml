name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          API: ${{ vars.YT_API_URL }}
        run: |
          test -n "$API" || { echo "::error::Задай переменную репозитория YT_API_URL (Settings > Secrets and variables > Actions > Variables)"; exit 1; }
          mkdir _site && cp index.html _site/ && touch _site/.nojekyll
          echo "window.YT_API='$API';" > _site/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
